
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>奇思妙写</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            animation: {
              'fade-in': 'fadeIn 0.5s ease-in-out',
              'fade-in-up': 'fadeInUp 0.5s ease-out',
              'pulse': 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            }
          }
        }
      }
    </script>
    <style>
      /* 动态隐藏滚动条样式 */
      .dynamic-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .dynamic-scrollbar::-webkit-scrollbar-thumb {
        background-color: transparent;
        border-radius: 10px;
        transition: background-color 0.3s;
      }
      .dynamic-scrollbar:hover::-webkit-scrollbar-thumb,
      .dynamic-scrollbar:active::-webkit-scrollbar-thumb {
        background-color: rgba(0, 0, 0, 0.08);
      }
      .dark .dynamic-scrollbar:hover::-webkit-scrollbar-thumb,
      .dark .dynamic-scrollbar:active::-webkit-scrollbar-thumb {
        background-color: rgba(255, 255, 255, 0.08);
      }
      
      /* 隐藏默认滚动条按钮 */
      .dynamic-scrollbar::-webkit-scrollbar-button {
        display: none;
      }
    </style>
